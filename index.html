<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RA Duty Pick · Residence Life</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f4;color:#173e36;font:16px "DM Sans",system-ui,sans-serif}header{background:#143f36;color:white;padding:18px max(5vw,20px);font-weight:650;letter-spacing:.05em}header span{display:inline-grid;place-items:center;border:1px solid #a5c4b7;border-radius:6px;padding:4px 6px;margin-right:12px;font:700 14px Georgia}main{max-width:1220px;margin:auto;padding:44px 5vw}h1,h2,h3{font-family:Georgia,serif;font-weight:normal;margin:0}h1{font-size:clamp(40px,6vw,70px);letter-spacing:-.055em}h2{font-size:30px}h3{font-size:23px}p{line-height:1.5}.row,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.hero{margin-bottom:28px}select,input,button{font:inherit;color:inherit}button,select,input{border:1px solid #bdcac1;background:white;padding:10px 14px;border-radius:7px}button,select,summary{cursor:pointer}button:disabled{opacity:.47;cursor:default}button:focus-visible,select:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #b16b14;outline-offset:1px}.rules{display:flex;flex-wrap:wrap;gap:10px 30px;padding:15px 0;border-block:1px solid #cfd8cd;font-size:14px}.rules b{margin-right:6px}.top{margin:28px 0 16px}.count{color:#46675b}.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:15px}.card{padding:19px 12px;background:#fff;border:1px solid #d3dbd2;border-radius:12px}.card h3{margin:0 0 14px 7px}.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:3px}.grid small{padding:4px 0;color:#65766d}.day{border:0;padding:0;height:38px;background:transparent;font-size:15px;font-variant-numeric:tabular-nums}.weekend{background:#eff2eb}.day[aria-pressed=true],.primary{background:#185542;color:white}.day:hover{box-shadow:inset 0 0 0 1px #527863}footer{margin-top:24px;padding:20px 0;border-top:1px solid #cfd8cd}details{margin-top:18px}summary{width:fit-content}#notice{color:#874317}label{display:inline-flex;gap:7px;align-items:center}input[type=number]{width:96px}@media(max-width:600px){main{padding:28px 14px}.hero{align-items:flex-start;flex-direction:column}.day{height:44px}.rules{gap:6px}.rules span{width:100%}}
</style>
<header><span aria-hidden="true">RL</span>Residence Life</header><main>
<div class="row spread hero"><h1>RA Duty Pick</h1><div class="row"><select id="season" aria-label="Semester"><option>Spring</option><option>Fall</option></select><input id="year" type="number" min="1900" max="9998" aria-label="Semester year"></div></div>
<div class="rules"><span><b>Sun–Thu</b>5 PM → 8 AM next day</span><span><b>Fri–Sat</b>5 PM → 5 PM next day</span></div>
<div class="row spread top"><h2 id="term"></h2><span class="count" id="count" aria-live="polite"></span></div><div class="months" id="months"></div>
<footer><div class="row spread"><div class="actions" id="exports"><button class="primary" data-ext="zip">Download all (.zip)</button><button data-ext="txt">Text list</button><button data-ext="ics">Calendar (.ics)</button><button data-ext="jpg">Semester JPG</button></div><button id="clear">Clear picks</button></div>
<details><summary>Combine RA schedules</summary><p>For a staff JPG, import each RA’s duty-pick calendar file. Name each file for its RA before importing. Your own picks appear as “My shifts.”</p><input type="file" accept=".ics" multiple id="imports" aria-label="Import RA calendar files"><div id="staff"></div></details>
<p role="status" id="notice"></p></footer></main>
<script>
'use strict';
const el=id=>document.getElementById(id), now=new Date(), month=now.getMonth();
const season=el('season'), year=el('year');
season.value=month>=3&&month<=8?'Fall':'Spring';
year.value=now.getFullYear()+Number(month>=9);
const prefix='ra-duty-v1:'+location.pathname+':';
const pad=n=>String(n).padStart(2,'0');
const key=d=>[d.getFullYear(),pad(d.getMonth()+1),pad(d.getDate())].join('-');
const date=s=>new Date(s+'T12:00:00');
const full=d=>d.toLocaleDateString('en-US',{dateStyle:'full'});
const weekdays=['Su','Mo','Tu','We','Th','Fr','Sa'];
let term,start,days,picks,staff;
function notice(msg){el('notice').textContent=msg}
function save(){try{localStorage.setItem(prefix+term,JSON.stringify({picks:[...picks],staff}))}catch{notice('Browser storage is unavailable. Download your picks before closing.')}}
function load(){
 if(!year.value||!year.reportValidity())return;
 term=season.value+' '+year.value;start=season.value==='Fall'?7:0;
 days=Array.from({length:5},(_,i)=>Array.from({length:new Date(+year.value,start+i+1,0).getDate()},(_,j)=>new Date(+year.value,start+i,j+1,12)));
 let data={};notice('');
 try{for(const k of Object.keys(localStorage)){if(!k.startsWith(prefix))continue;const [s,y]=k.slice(prefix.length).split(' ');if(new Date(+y,s==='Fall'?12:5,2)<=now)localStorage.removeItem(k)}
 data=JSON.parse(localStorage.getItem(prefix+term))||{}
 }catch{notice('Browser memory could not be read. Download your picks before closing.')}
 picks=new Set(data.picks||[]);staff=data.staff||[];el('term').textContent=term;
 el('months').replaceChildren();
 for(const dates of days){const card=document.createElement('section');card.className='card';
 const heading=document.createElement('h3');heading.textContent=dates[0].toLocaleString('en-US',{month:'long'});card.append(heading);
 const grid=document.createElement('div');grid.className='grid';
 for(const w of weekdays){const label=document.createElement('small');label.textContent=w;grid.append(label)}
 for(const d of dates){const k=key(d),btn=document.createElement('button');btn.className='day'+(d.getDay()>=5?' weekend':'');btn.style.gridColumn=String(d.getDay()+1);btn.textContent=d.getDate();btn.setAttribute('aria-label',full(d));btn.setAttribute('aria-pressed',picks.has(k));btn.onclick=()=>{if(picks.has(k))picks.delete(k);else picks.add(k);btn.setAttribute('aria-pressed',picks.has(k));save();refresh()};grid.append(btn)}
 card.append(grid);el('months').append(card)}refresh()
}
function refresh(){
 el('count').textContent=picks.size+' shift'+(picks.size===1?'':'s')+' selected';el('clear').disabled=!picks.size;
 for(const b of el('exports').children)b.disabled=!picks.size&&!(staff.length&&['zip','jpg'].includes(b.dataset.ext));
 el('staff').replaceChildren();for(const entry of staff){const b=document.createElement('button');b.textContent='Remove '+entry.name;b.onclick=()=>{if(confirm('Remove '+entry.name+' from this semester image?')){staff=staff.filter(x=>x!==entry);save();refresh()}};el('staff').append(b)}
}
season.onchange=year.onchange=load;el('clear').onclick=()=>{if(confirm('Clear your '+picks.size+' duty picks for '+term+'?')){picks.clear();save();load()}};
el('imports').onchange=async e=>{const files=[...e.target.files],target=term,valid=new Set(days.flat().map(key));let missed=0;
 for(const f of files){const content=await f.text();if(target!==term)return;
 const dates=[...content.matchAll(/^DTSTART:(\d{4})(\d{2})(\d{2})T170000\r?$/gm)].map(m=>m.slice(1).join('-')).filter(k=>valid.has(k));
 if(!dates.length){missed++;continue}const name=f.name.replace(/\.ics$/i,'');staff=staff.filter(x=>x.name!==name);staff.push({name,dates:[...new Set(dates)]});save();refresh()}
 notice(missed?missed+' file(s) had no matching duty starts for '+term+'.':'Staff calendars added to the semester image.');e.target.value=''
};
function calendar(list){const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Residence Life//Duty Pick//EN','CALSCALE:GREGORIAN'];
 const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
 for(const k of list){const d=date(k),endHour=d.getDay()>=5?'170000':'080000';d.setDate(d.getDate()+1);
 lines.push('BEGIN:VEVENT','UID:'+k+'@ra-duty-pick','DTSTAMP:'+stamp,'DTSTART:'+k.replaceAll('-','')+'T170000','DTEND:'+key(d).replaceAll('-','')+'T'+endHour,'SUMMARY:RA Duty','END:VEVENT')}
 return lines.concat('END:VCALENDAR','').join('\r\n')
}
function picture(){const groups=[{name:'My shifts',dates:[...picks]},...staff],canvas=document.createElement('canvas');
 const rowH=58,maxOwners=Math.max(1,...days.flat().map(d=>groups.filter(g=>g.dates.includes(key(d))).length));
 const cellH=rowH+maxOwners*24,block=98+cellH*6;
 canvas.width=1440;canvas.height=140+3*block;const c=canvas.getContext('2d');
 c.fillStyle='#fafbf7';c.fillRect(0,0,canvas.width,canvas.height);
 function label(t,x,y,size,color='#173e36',width=1300){c.fillStyle=color;c.font=size+'px system-ui';c.fillText(t,x,y,width)}
 label('Residence Life  /  RA Duty',32,46,24);label(term,32,108,50);
 days.forEach((dates,i)=>{const x=32+(i%2)*700,y=150+Math.floor(i/2)*block;label(dates[0].toLocaleString('en-US',{month:'long'}),x,y+28,30);
 weekdays.forEach((w,j)=>label(w,x+j*95,y+68,19));
 dates.forEach(d=>{const k=key(d),owners=groups.filter(g=>g.dates.includes(k)),left=x+d.getDay()*95,top=y+80+Math.floor((dates[0].getDay()+d.getDate()-1)/7)*cellH;
 c.fillStyle=owners.length?'#175542':'#eaf0e8';c.fillRect(left,top,91,cellH-4);const ink=owners.length?'white':'#173e36';label(d.getDate(),left+6,top+32,24,80);
 owners.forEach((o,n)=>label(o.name,left+5,top+58+n*24,17,ink,81))})});
 return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Image too large')),'image/jpeg',.94))
}
async function zip(files){const local=[],central=[];let offset=0;
 function header(size){const bytes=new Uint8Array(size),v=new DataView(bytes.buffer);return {bytes,u16:(i,n)=>v.setUint16(i,n,true),u32:(i,n)=>v.setUint32(i,n,true)}}
 for(const [name,blob] of files){const data=new Uint8Array(await blob.arrayBuffer()),filename=new TextEncoder().encode(name);let crc=-1;
 for(const byte of data){crc^=byte;for(let i=0;i<8;i++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}crc=(~crc)>>>0;
 const a=header(30),b=header(46);a.u32(0,0x04034b50);a.u16(4,20);a.u16(12,33);a.u32(14,crc);a.u32(18,data.length);a.u32(22,data.length);a.u16(26,filename.length);
 b.u32(0,0x02014b50);b.u16(4,20);b.bytes.set(a.bytes.slice(4,28),6);b.u32(42,offset);
 local.push(a.bytes,filename,data);central.push(b.bytes,filename);offset+=30+filename.length+data.length}
 const end=header(22);end.u32(0,0x06054b50);end.u16(8,files.length);end.u16(10,files.length);end.u32(12,central.reduce((n,b)=>n+b.length,0));end.u32(16,offset);return new Blob([...local,...central,end.bytes],{type:'application/zip'})
}
el('exports').onclick=async e=>{const ext=e.target.dataset.ext;if(!ext)return;
 try{const list=[...picks].sort(),base='RA-Duty-'+term.replace(' ','-'),files={txt:new Blob([list.map(k=>full(date(k))).join('\r\n')+'\r\n'],{type:'text/plain'}),ics:new Blob([calendar(list)],{type:'text/calendar'})};
 if(ext==='jpg'||ext==='zip')files.jpg=await picture();
 const blob=ext==='zip'?await zip(Object.entries(files).map(([suffix,data])=>[base+'.'+suffix,data])):files[ext];
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=base+'.'+ext;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)
 }catch{notice('Download failed. Try again or download an individual file.')}}
window.addEventListener('storage',e=>{if(e.key===prefix+term||e.key===null)load()});load()
</script></html>
